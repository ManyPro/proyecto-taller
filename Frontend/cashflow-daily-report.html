<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reporte Diario de Caja</title>
  <link rel="stylesheet" href="./assets/ui.css?v=20260727d" />
  <link rel="stylesheet" href="./assets/css/pages/home.css?v=20260727d" />
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <style>
    :root {
      color-scheme: light;
    }

    .report-page {
      display: flex;
      flex-direction: column;
      min-height: max(calc(100vh - 2rem), 1280px) !important;
    }

    .account-report-page {
      display: flex;
      flex-direction: column;
      min-height: max(calc(100vh - 2rem), 1280px) !important;
      background: linear-gradient(180deg, #ffffff 0%, #f8fbff 55%, #eef7ff 100%) !important;
    }

    .account-report-page .account-metric-card {
      min-height: 180px;
    }

    .account-report-page .account-meta-line {
      display: block;
      font-size: 1.2rem;
      line-height: 1.8;
    }

    .summary-metric-card {
      min-height: 260px;
    }

    #summary-expense-card {
      background: #fff1f2 !important;
      border-color: #fecdd3 !important;
    }

    .account-expense-card {
      background: #fff1f2 !important;
      border-color: #fecdd3 !important;
    }

    @media print {
      body {
        background: #ffffff !important;
      }

      main {
        max-width: none !important;
        padding: 0 !important;
      }

      .report-page,
      .account-report-page {
        min-height: 277mm;
        margin: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        break-after: page;
        page-break-after: always;
      }

      .account-report-page:last-child {
        break-after: auto;
        page-break-after: auto;
      }
    }

    #report-pdf {
      background: linear-gradient(90deg, #16a34a, #15803d) !important;
      color: #ffffff !important;
      border: 1px solid rgba(34, 197, 94, 0.45) !important;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.22);
    }

    #report-close {
      background: #ffffff !important;
      color: #334155 !important;
      border: 1px solid #cbd5e1 !important;
      box-shadow: 0 10px 20px rgba(148, 163, 184, 0.18);
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="max-w-[1180px] mx-auto px-4 py-4 md:py-6 space-y-8">
    <section class="report-page rounded-2xl border border-sky-100 bg-gradient-to-br from-white via-slate-50 to-sky-100 shadow-2xl overflow-hidden">
      <div class="px-5 py-5 md:px-6 md:py-6 border-b border-slate-200">
        <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
          <div>
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900">Cierre de Caja</h1>
            <p id="report-subtitle" class="mt-4 text-lg md:text-xl text-slate-600">Preparando datos del cierre...</p>
          </div>
          <div class="flex flex-wrap gap-2 print:hidden">
            <button id="report-pdf" type="button" onclick="window.generateCashflowPdf?.()" class="px-4 py-2.5 text-base font-semibold rounded-lg transition-all duration-200 cursor-pointer">Generar PDF</button>
            <button id="report-close" type="button" onclick="window.closeCashflowReportTab?.()" class="px-4 py-2.5 text-base bg-white hover:bg-slate-100 text-slate-700 font-semibold rounded-lg border border-slate-300 transition-all duration-200 cursor-pointer">Cerrar</button>
          </div>
        </div>
      </div>

      <div class="px-5 py-5 md:px-6 md:py-6 gap-5 flex-1 flex flex-col">
        <div id="report-error" class="hidden rounded-xl border border-rose-200 bg-rose-50 text-rose-700 px-4 py-3 text-sm"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 flex-1 auto-rows-fr">
          <div class="summary-metric-card rounded-2xl bg-white border border-slate-200 p-7 shadow-lg flex flex-col justify-between">
            <div class="text-lg uppercase tracking-wide text-slate-500 font-semibold">Saldo inicial</div>
            <div id="summary-initial" class="mt-4 text-5xl md:text-6xl font-extrabold text-slate-900">$0</div>
          </div>
          <div class="summary-metric-card rounded-2xl bg-white border border-slate-200 p-7 shadow-lg flex flex-col justify-between">
            <div class="text-lg uppercase tracking-wide text-slate-500 font-semibold">Saldo actual</div>
            <div id="summary-current" class="mt-4 text-5xl md:text-6xl font-extrabold text-slate-900">$0</div>
          </div>
          <div class="summary-metric-card rounded-2xl bg-emerald-50 border border-emerald-200 p-7 shadow-lg flex flex-col justify-between">
            <div class="text-lg uppercase tracking-wide text-emerald-700 font-semibold">Ingresos</div>
            <div id="summary-income" class="mt-4 text-5xl md:text-6xl font-extrabold text-emerald-700">$0</div>
          </div>
          <div id="summary-expense-card" class="summary-metric-card rounded-2xl border p-7 shadow-lg flex flex-col justify-between">
            <div class="text-lg uppercase tracking-wide text-rose-700 font-semibold">Salidas (egresos)</div>
            <div id="summary-expense" class="mt-4 text-5xl md:text-6xl font-extrabold text-rose-700">$0</div>
          </div>
        </div>

        <section class="grid grid-cols-1 gap-5">
          <div class="rounded-2xl border border-sky-100 bg-sky-50/80 px-7 py-7 shadow-sm min-h-[240px] flex flex-col justify-between">
            <div>
              <div class="text-lg uppercase tracking-wide text-sky-700 font-semibold">Reportes individuales</div>
              <div id="accounts-count-hero" class="mt-5 text-5xl md:text-6xl font-extrabold text-slate-900">0</div>
            </div>
          </div>
        </section>

        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-2xl md:text-3xl font-bold text-slate-900">Detalle por cuenta</h2>
            <span id="accounts-count" class="text-base font-medium text-slate-500">0 reportes individuales</span>
          </div>
        </section>
      </div>
    </section>

    <section id="report-accounts" class="space-y-8"></section>
  </main>

  <script type="module" src="./assets/js/cashflow-daily-report.js?v=20260727d" charset="utf-8"></script>
</body>
</html>
