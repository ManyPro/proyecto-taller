<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reporte Diario de Caja</title>
  <link rel="stylesheet" href="./assets/ui.css?v=20260340" />
  <link rel="stylesheet" href="./assets/css/pages/home.css?v=20260332" />
  <script src="./assets/js/theme-engine.js"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/api.js"></script>
  <style>
    #report-pdf {
      background: linear-gradient(90deg, #16a34a, #15803d) !important;
      color: #ffffff !important;
      border: 1px solid rgba(34, 197, 94, 0.45) !important;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.22);
    }

    #report-close {
      background: rgba(51, 65, 85, 0.92) !important;
      color: #ffffff !important;
      border: 1px solid rgba(100, 116, 139, 0.55) !important;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-white theme-light:bg-sky-50 theme-light:text-slate-900">
  <main class="max-w-3xl mx-auto px-4 py-4 md:py-6">
    <section class="rounded-2xl border border-sky-500/20 theme-light:border-sky-200 bg-gradient-to-br from-slate-900 via-slate-900 to-sky-950/70 theme-light:from-white theme-light:via-sky-50 theme-light:to-indigo-50 shadow-2xl overflow-hidden">
      <div class="px-5 py-5 md:px-6 md:py-6 border-b border-slate-800 theme-light:border-sky-100">
        <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
          <div>
            <p class="text-xs uppercase tracking-[0.22em] text-sky-300 theme-light:text-sky-700 font-semibold mb-2">Reporte Diario</p>
            <h1 class="text-2xl md:text-[2rem] font-extrabold text-white theme-light:text-slate-900">Cierre de Caja</h1>
            <p id="report-subtitle" class="mt-3 text-sm text-slate-300 theme-light:text-slate-600">Preparando datos del cierre...</p>
          </div>
          <div class="flex flex-wrap gap-2 print:hidden">
            <button id="report-pdf" type="button" onclick="window.generateCashflowPdf?.()" class="px-3 py-1.5 text-sm font-semibold rounded-lg transition-all duration-200 cursor-pointer">Generar PDF</button>
            <button id="report-close" type="button" onclick="window.closeCashflowReportTab?.()" class="px-3 py-1.5 text-sm bg-slate-700/70 theme-light:bg-slate-200 hover:bg-slate-700 theme-light:hover:bg-slate-300 text-white theme-light:text-slate-800 font-semibold rounded-lg border border-slate-600/50 theme-light:border-slate-300 transition-all duration-200 cursor-pointer">Cerrar</button>
          </div>
        </div>
      </div>

      <div class="px-5 py-5 md:px-6 md:py-6 space-y-5">
        <div id="report-error" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 text-rose-200 theme-light:text-rose-700 px-4 py-3 text-sm"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="rounded-2xl bg-slate-900/70 theme-light:bg-white border border-slate-700/50 theme-light:border-slate-200 p-4 shadow-lg">
            <div class="text-xs uppercase tracking-wide text-slate-400 theme-light:text-slate-500 font-semibold">Saldo inicial</div>
            <div id="summary-initial" class="mt-2 text-2xl font-extrabold text-white theme-light:text-slate-900">$0</div>
          </div>
          <div class="rounded-2xl bg-slate-900/70 theme-light:bg-white border border-slate-700/50 theme-light:border-slate-200 p-4 shadow-lg">
            <div class="text-xs uppercase tracking-wide text-slate-400 theme-light:text-slate-500 font-semibold">Saldo actual</div>
            <div id="summary-current" class="mt-2 text-2xl font-extrabold text-white theme-light:text-slate-900">$0</div>
          </div>
          <div class="rounded-2xl bg-emerald-500/10 theme-light:bg-emerald-50 border border-emerald-500/20 theme-light:border-emerald-200 p-4 shadow-lg">
            <div class="text-xs uppercase tracking-wide text-emerald-300 theme-light:text-emerald-700 font-semibold">Ingresos</div>
            <div id="summary-income" class="mt-2 text-2xl font-extrabold text-emerald-300 theme-light:text-emerald-700">$0</div>
          </div>
          <div class="rounded-2xl bg-rose-500/10 theme-light:bg-rose-50 border border-rose-500/20 theme-light:border-rose-200 p-4 shadow-lg">
            <div class="text-xs uppercase tracking-wide text-rose-300 theme-light:text-rose-700 font-semibold">Salidas (egresos)</div>
            <div id="summary-expense" class="mt-2 text-2xl font-extrabold text-rose-300 theme-light:text-rose-700">$0</div>
          </div>
        </div>

        <section class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-lg md:text-xl font-bold text-white theme-light:text-slate-900">Detalle por cuenta</h2>
            <span id="accounts-count" class="text-xs font-medium text-slate-400 theme-light:text-slate-500">0 cuentas</span>
          </div>
          <div id="report-accounts" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="./assets/js/cashflow-daily-report.js" charset="utf-8"></script>
</body>
</html>
