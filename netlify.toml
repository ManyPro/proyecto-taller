# Configuración para Netlify
# IMPORTANTE: Para evitar conflictos entre producción y desarrollo:
# - Crear DOS SITIOS SEPARADOS en Netlify:
#   1. Sitio de PRODUCCIÓN: conectado al branch 'main' (puerto 4000)
#   2. Sitio de DESARROLLO: conectado al branch 'develop' (puerto 4001)
#
# Esta configuración se aplica a ambos, pero cada sitio tiene su propia URL y deploy independiente.

[build]
  base = "."
  publish = "Frontend"
  command = "echo 'Frontend listo'"

# API redirects for THIS branch.
# develop Netlify site (proyecto-taller-dev.netlify.app) uses develop as its
# production branch, so these must hit :4001. Keep :4000 on main only.
# Do not merge these develop redirects into main.

[context.production]
  [[context.production.redirects]]
    from = "/api/*"
    to = "http://143.110.131.35:4001/api/:splat"
    status = 200
    force = true
  [[context.production.redirects]]
    from = "/uploads/*"
    to = "http://143.110.131.35:4001/uploads/:splat"
    status = 200
    force = true

[context.dev]
  [[context.dev.redirects]]
    from = "/api/*"
    to = "http://143.110.131.35:4001/api/:splat"
    status = 200
    force = true
  [[context.dev.redirects]]
    from = "/uploads/*"
    to = "http://143.110.131.35:4001/uploads/:splat"
    status = 200
    force = true

[[redirects]]
  from = "/api/*"
  to = "http://143.110.131.35:4001/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "http://143.110.131.35:4001/uploads/:splat"
  status = 200
  force = true

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers específicos para archivos estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
